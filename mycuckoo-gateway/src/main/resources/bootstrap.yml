server:
  port: 6060
spring:
  application:
    name: gateway
  codec:
    max-in-memory-size: 512KB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
        namespace: dev
      config:
        enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: http://localhost:8080
            allowedMethods: "*"
            allowedHeaders: "Authorization"
            allowCredentials: true
      httpclient:
        pool:
          maxIdleTime: 10000
        connect-timeout: 1000
        response-timeout: 120s
      routes:
        - id: admin
          uri: lb://admin
          predicates:
            - Path=/admin/**
#            - ReadBody=#{T(String)},#{@readBodyPredicate}
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_UNIQUE
            - StripPrefix=1
#            - name: Retry

knife4j:
  gateway:
    enabled: true
    tags-sorter: order
    operations-sorter: order
    # 指定手动配置的模式(默认为该模式)
    strategy: manual
    routes:
      - name: admin
        url: /admin/v3/api-docs?group=default
        service-name: admin
        context-path: /admin
        order: 2

mycuckoo:
  config:
    session-urls:
      - /admin/login/orgs
      - /admin/login/menus
      - /admin/platform/config/list-table-config
      - /admin/platform/system/dictionary/mgr/small-type
    allow-urls:
      - /admin/register
      - /admin/login
      - /admin/login/logout
      - /admin/captcha/**
      - /admin/file/**
      - /admin/h2/**
      - /admin/swagger-resources/**
      - /admin/v3/api-docs/**
      - /admin/static/**
      - /admin/view/**
      - /**/*.html
      - /**/*.css
      - /**/*.js
      - /**/*.png
  logger:
    feign:
      enabled: true
      include-headers: true
      include-payload: true

feign:
  client:
    config:
      default:
        loggerLevel: FULL
        connect-timeout: 60000
        read-timeout: 180000